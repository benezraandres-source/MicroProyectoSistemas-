name: flutter_application_1
description: "Rompecabezas deslizante con récords locales y preferencias visuales."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PuzzleSans
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
